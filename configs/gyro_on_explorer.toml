

name = "Etc Testing"

[ autoload ]
match_exe_name = "(explorer|cmd|Code).exe"
#match_window_name = ".*"
#match_controller_name = ".*"

[ led ]
color_sequence = [{x=1,y=0,z=1}]

[ mapping ]
#LSTICK = "MOUSE"
L2 = "RMOUSE"
R2 = "LMOUSE"
GYRO = "MOUSE"

[ mapping.LSTICK ]
map_as = "AIM"

[ gyro ]
mode = "PLAYER_TURN"
sens = 3
fast_sens = [5, 4]
slow_threshold = 5
fast_threshold = 75
#smooth_window = 0
smooth_threshold = 5
tightening_theshold = 5